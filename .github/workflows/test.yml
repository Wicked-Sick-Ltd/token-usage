name: test
on:
  push:
    branches: [main, "v*-dev"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest 'ruff==0.16.6'
      # -W error: a warning the suite provokes is a failure, on both
      # interpreters — the same gate the contributor guide sets locally.
      - run: python3 -m pytest tests/ -v -W error
      - run: ruff check scripts tests
  plugin-validate:
    # Anthropic's own manifest check, pinned so a new Claude Code release cannot
    # change the result under an unchanged commit. Warnings (for example the
    # contributor CLAUDE.md at the root) are allowed; errors fail the job.
    # Uses the runner's preinstalled Node.js.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npx --yes @anthropic-ai/claude-code@2.1.288 plugin validate .
  native-copilot:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install pytest
      - run: npm install --prefix "${{ runner.temp }}/copilot-test" --no-audit --no-fund @github/copilot@1.0.91
      - name: Select native executable
        shell: python
        run: |
          import os
          from pathlib import Path
          package = "copilot-win32-x64/copilot.exe" if os.name == "nt" else "copilot-linux-x64/copilot"
          path = Path(os.environ["RUNNER_TEMP"]) / "copilot-test/node_modules/@github" / package
          assert path.is_file(), path
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"COPILOT_TEST_CLI={path}\n")
      - run: python -m pytest tests/test_codex.py tests/test_gemini.py tests/test_copilot.py tests/test_copilot_native.py tests/test_directory_readiness.py -v -W error
